<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>独立 MLX · 流式录音</title>
<style>body{font:16px/1.7 system-ui;background:#f4f2ee;color:#272922;margin:0}main{max-width:760px;margin:7vh auto;padding:24px}small{letter-spacing:.12em;color:#67705e}h1{font-size:36px;line-height:1.3}button{font:inherit;border:0;border-radius:10px;padding:12px 24px;background:#304c38;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}#stop{background:#825343}#text{background:white;min-height:180px;padding:28px;border-radius:16px;font-size:25px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:24px}#metrics{font-variant-numeric:tabular-nums;color:#586150}#status{min-height:28px}.note{font-size:14px;color:#666}</style>
<main><small>INDEPENDENT MLX / STREAMING EXPERIMENT</small><h1>说话时，文字逐步出现。</h1><p>原版流式权重 · 160 毫秒增量推理 · 仅连接本机</p><p class="note">实验版仍有漏字、错字，尚未与原生推理逐层对齐。此处显示流式原始结果，不做非流式二次修正。单次最长 17 秒。</p><button id="start">开始录音</button> <button id="stop" disabled>停止并收尾</button><p id="status" role="status">允许麦克风后即可测试。</p><div id="text" aria-live="polite"></div><p id="metrics"></p><p class="note">首字时间从录音开始计；请求耗时包含本机传输、排队和推理。停止后的尾部静音只用于冲刷模型。录音不会写入文件。</p></main>
<script>
const $=id=>document.getElementById(id);let ctx,media,node,source,gain,session,sequence=0,queue=Promise.resolve(),recording=false,started,first,packets=0,timer,failed=false;
async function post(path,body=new Uint8Array()) {const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Session':session||'','X-Sequence':String(sequence)},body});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||r.status);return d;}
function show(d,rtt){$('text').textContent=d.text||'';if(d.text&&!first)first=(performance.now()-started)/1000;$('metrics').textContent=`音频 ${(d.duration||0).toFixed(2)} s · 首字 ${first?first.toFixed(2)+' s':'等待'} · 最近请求 ${(rtt*1000).toFixed(0)} ms · 推理累计 ${(d.inference||0).toFixed(2)} s`;}
function cleanup(){recording=false;clearInterval(timer);if(node){node.onaudioprocess=null;node.disconnect();}source?.disconnect();gain?.disconnect();media?.getTracks().forEach(t=>t.stop());ctx?.close();node=source=gain=media=ctx=null;}
async function abort(e){if(failed)return;failed=true;cleanup();$('status').textContent='错误：'+e.message;try{await post('/cancel');}catch{}$('start').disabled=false;$('stop').disabled=true;}
$('start').onclick=async()=>{failed=false;$('start').disabled=true;$('text').textContent='';$('metrics').textContent='';first=null;sequence=0;packets=0;queue=Promise.resolve();try{media=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ctx=new AudioContext({sampleRate:16000});await ctx.resume();if(ctx.sampleRate!==16000)throw Error('浏览器不支持 16 kHz AudioContext，请使用 Chrome 或 Safari。');const d=await post('/start');session=d.session;source=ctx.createMediaStreamSource(media);node=ctx.createScriptProcessor(2048,1,1);gain=ctx.createGain();gain.gain.value=0;source.connect(node);node.connect(gain);gain.connect(ctx.destination);started=performance.now();recording=true;node.onaudioprocess=e=>{if(!recording)return;const a=e.inputBuffer.getChannelData(0),pcm=new DataView(new ArrayBuffer(a.length*2));for(let i=0;i<a.length;i++)pcm.setInt16(i*2,Math.round(Math.max(-1,Math.min(1,a[i]))*32767),true);packets++;if(packets>24){abort(Error('推理赶不上录音，请缩短录音并关闭占用 GPU 的程序。'));return;}queue=queue.then(async()=>{if(failed)return;const t=performance.now();const out=await post('/feed',pcm.buffer);sequence++;packets--;show(out,(performance.now()-t)/1000);}).catch(abort);};$('stop').disabled=false;$('status').textContent='正在录音，等待流式文字…';timer=setInterval(()=>{if(performance.now()-started>=17000)$('stop').click();},100);}catch(e){await abort(e);}};
$('stop').onclick=async()=>{if(!recording)return;cleanup();$('stop').disabled=true;$('status').textContent='正在处理最后的音频…';await queue;if(failed)return;try{const t=performance.now();const out=await post('/finish');show(out,(performance.now()-t)/1000);$('status').textContent=`已完成 · 停止后收尾 ${((performance.now()-t)/1000).toFixed(2)} s`;}catch(e){await abort(e);}finally{$('start').disabled=false;}};
</script></html>
