<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豆包 · 本地语音实验</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#202b29;background:#f3f5f1}*{box-sizing:border-box}body{margin:0;padding:48px 24px}main{max-width:800px;margin:auto}.eyebrow{font-size:12px;letter-spacing:2px;color:#568375}h1{font-size:36px;font-weight:600;letter-spacing:-1px;margin:18px 0 12px}p{color:#65746d;line-height:1.7}.panel{background:white;border:1px solid #dfe6dd;border-radius:22px;padding:30px;margin-top:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.badge{font-size:12px;background:#e9f3eb;color:#33664e;padding:7px 12px;border-radius:30px}#timer{font-variant-numeric:tabular-nums;font-size:40px;font-weight:300}.meter{height:7px;background:#eef2ed;border-radius:5px;margin:24px 0;overflow:hidden}.meter div{height:100%;width:0;background:#77a48a;transition:width .08s}button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:14px 24px;background:#244f40;color:white}button:disabled{opacity:.5;cursor:default}button.secondary{background:#edf2eb;color:#305443;margin-left:8px}#status{min-height:26px;font-size:14px;margin:16px 0 0}#result{font-size:23px;line-height:1.8;white-space:pre-wrap;min-height:100px;margin:20px 0}.muted{color:#9aa79e}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;border-top:1px solid #e9ede6;padding-top:22px}.stats span{display:block;font-size:12px;color:#78877e}.stats b{display:block;font-weight:500;font-size:22px;margin-top:9px}.small{font-size:12px}audio{width:100%;margin:16px 0}#error{color:#a63f3f;white-space:pre-wrap}.foot{font-size:13px;margin-top:22px}@media(max-width:550px){body{padding:24px 16px}h1{font-size:28px}.panel{padding:22px}.stats{grid-template-columns:1fr 1fr}}
</style>
<main><div class="eyebrow">LOCAL VOICE LAB / 01</div><h1>听听真实人声的效果。</h1><p>豆包原版离线模型 · 本机识别 · 录音不上传云端</p>
<section class="panel"><div class="top"><div><span class="badge" id="badge">准备就绪</span><p class="small">建议先录制 5–20 秒，最长 2 分钟</p></div><div id="timer">00:00</div></div><div class="meter"><div id="level"></div></div><button id="record">开始录音</button><button class="secondary" id="stop" disabled>停止并识别</button><p id="status">首次使用时，请允许浏览器访问麦克风。</p><p id="error" role="alert"></p><audio id="playback" controls hidden></audio></section>
<section class="panel"><div class="top"><strong>识别结果</strong><button class="secondary" id="copy" disabled>复制文字</button></div><div id="result" class="muted" aria-live="polite">你的话，会出现在这里。</div><div class="stats"><div><span>录音时长</span><b id="duration">—</b></div><div><span>模型加载</span><b id="load">—</b></div><div><span>识别计算</span><b id="inference">—</b></div><div><span>停止后总等待</span><b id="total">—</b></div></div><p id="speed" class="small"></p></section>
<p class="foot">每次识别会重新加载模型，加载时间单独计入。识别计算包含完整音频处理和最终文字生成，不是边说边显示。录音与结果仅保留在当前页面，服务端临时文件在请求结束后删除。</p></main>
<script>
const $=id=>document.getElementById(id);let stream,ctx,node,source,gain,chunks=[],rate,start,clock,url,recording=false;
function cleanup(){clearInterval(clock);if(node){node.onaudioprocess=null;node.disconnect()}source?.disconnect();gain?.disconnect();stream?.getTracks().forEach(t=>t.stop());ctx?.close();node=source=gain=stream=ctx=null;$('level').style.width='0%'}
function wav(parts,sr){let n=parts.reduce((s,a)=>s+a.length,0),buffer=new ArrayBuffer(44+n*2),v=new DataView(buffer);function str(i,s){for(let j=0;j<s.length;j++)v.setUint8(i+j,s.charCodeAt(j))}str(0,'RIFF');v.setUint32(4,36+n*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,n*2,true);let i=44;for(const a of parts)for(let s of a){s=Math.max(-1,Math.min(1,s));v.setInt16(i,s<0?s*32768:s*32767,true);i+=2}return new Blob([buffer],{type:'audio/wav'})}
$('record').onclick=async()=>{try{$('error').textContent='';$('record').disabled=true;stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true},video:false});ctx=new AudioContext();await ctx.resume();rate=ctx.sampleRate;chunks=[];source=ctx.createMediaStreamSource(stream);node=ctx.createScriptProcessor(4096,1,1);gain=ctx.createGain();gain.gain.value=0;source.connect(node);node.connect(gain);gain.connect(ctx.destination);recording=true;start=performance.now();node.onaudioprocess=e=>{if(!recording)return;const a=new Float32Array(e.inputBuffer.getChannelData(0));chunks.push(a);let sum=0;for(const x of a)sum+=x*x;$('level').style.width=Math.min(100,Math.sqrt(sum/a.length)*350)+'%'};$('stop').disabled=false;$('badge').textContent='正在录音';$('status').textContent='可以自然说话。停止后会自动识别。';clock=setInterval(()=>{let t=Math.floor((performance.now()-start)/1000);$('timer').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t>=120)finish()},200)}catch(e){cleanup();$('record').disabled=false;$('error').textContent=e.name==='NotAllowedError'?'麦克风权限未开启。请在浏览器地址栏或系统设置中允许麦克风，再试一次。':e.message}};
async function finish(){if(!recording)return;recording=false;cleanup();$('stop').disabled=true;$('badge').textContent='识别中';$('status').textContent='正在加载本地模型并识别，请稍候…';const audio=wav(chunks,rate);chunks=[];if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(audio);$('playback').src=url;$('playback').hidden=false;try{const response=await fetch('/transcribe',{method:'POST',headers:{'Content-Type':'audio/wav'},body:audio});const d=await response.json();if(!response.ok)throw Error(d.error);$('result').textContent=d.text||'（没有识别到语音）';$('result').classList.remove('muted');$('copy').disabled=!d.text;for(const id of ['duration','load','inference','total'])$(id).textContent=d[id]==null?'—':d[id].toFixed(2)+' s';$('speed').textContent=d.inference>0?`识别计算实时率 ${(d.inference/d.duration).toFixed(3)} · 约 ${(d.duration/d.inference).toFixed(1)} 倍实时速度（不含加载）`:'';$('status').textContent='识别完成。可以回放录音，或录制下一段。';$('badge').textContent='已完成'}catch(e){$('error').textContent=e.message;$('badge').textContent='识别失败';$('status').textContent='可以重新录音尝试。'}finally{$('record').disabled=false}}
$('stop').onclick=finish;$('copy').onclick=()=>navigator.clipboard.writeText($('result').textContent);window.addEventListener('pagehide',cleanup);
</script></html>
